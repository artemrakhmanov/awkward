<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="dark" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="3" seed="4" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.29  0 0 0 0 0.17  0 0 0 0 0.07  0 0 0 -2.4 1.25"/>
  </filter>
  <filter id="light" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="11" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.93  0 0 0 0 0.8  0 0 0 0 0.62  0 0 0 3 -1.75"/>
  </filter>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="2" stitchTiles="stitch"/>
    <feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.28  0 0 0 0 0.12  0 0 0 0.5 -0.1"/>
  </filter>
  <rect width="360" height="360" fill="#c18f5c"/>
  <rect width="360" height="360" filter="url(#grain)"/>
  <rect width="360" height="360" filter="url(#dark)"/>
  <rect width="360" height="360" filter="url(#light)"/>
</svg>
